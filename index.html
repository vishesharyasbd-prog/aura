<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;

html, body {
  width: 100%;

body {
  min-height: 100svh;
  display: flex;

  align-items: center;

  background:

    rgba(183,139,54,.13), transparent 55%),
    #080808;
  color: #fff;
  font-family: Arial, Helvetica, sans-serif;
}

.main {
  width: 100%;
  max-width: 390px;
  text-align: center;
}

.card {
  width: 100%;
  padding: 34px 23px 25px;
  border: 1px solid rgba(218,180,103,.28);
  border-radius: 22px;
  background: rgba(255,255,255,.045);
  box-shadow:
    0 15px 50px rgba(0,0,0,.48),
    inset 0 1px 0 rgba(255,255,255,.07);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}

.logo {
  width: 76px;
  height: 76px;
  margin: 0 auto 19px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  border: 1px solid rgba(226,187,105,.7);
  background: linear-gradient(145deg,#30240f,#100e09);
  color: #edca82;
  font-size: 27px;
  font-weight: 800;
  letter-spacing: -2px;
  box-shadow: 0 0 25px rgba(207,163,75,.13);
}

.brand {
  font-size: 29px;
  font-weight: 800;
  letter-spacing: 3px;
  color: #e8c47d;
  margin-bottom: 8px;
}

.line {
  width: 44px;
  height: 2px;
  margin: 0 auto 18px;
  background: #c6a15d;
  border-radius: 10px;
}

.subtitle {
  color: #c3c0b9;
  font-size: 13px;
  line-height: 1.6;
  margin-bottom: 24px;
}

.join-btn {
  width: 100%;
  min-height: 53px;
  border: 1px solid #f1d69c;
  border-radius: 11px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  background: linear-gradient(110deg,#b78b42,#f0d49a,#b78b42);
  color: #171108;
  text-decoration: none;
  font-size: 15px;
  font-weight: 800;
  letter-spacing: .7px;
  box-shadow: 0 5px 22px rgba(193,149,65,.19);
  transition: transform .15s ease;
  -webkit-tap-highlight-color: transparent;
}

.join-btn:active {
  transform: scale(.98);
}

.telegram-icon {
  width: 19px;
  height: 19px;
  fill: #171108;
}

.footer {
  margin-top: 20px;
  color: #77736c;
  font-size: 10px;
  letter-spacing: 1px;
}

@media(max-width:360px) {
  .card {
    padding: 29px 18px 22px;

<main class="main">
  <section class="card">

    <div class="logo">AC</div>

    <div class="line"></div>

    <p class="subtitle">
      Welcome to the official AURA CRICO community.
      Connect with us on Telegram.
    </p>

    <a
      href="https://t.me/+6ah60rDmfi05ZGFl"
      class="join-btn"
      id="joinButton"
      aria-label="Join AURA CRICO on Telegram"
    >
      <svg class="telegram-icon" viewBox="0 0 24 24">
        <path d="M21.9 4.6 18.6 20c-.25 1.1-.9 1.35-1.83.84l-5.05-3.72-2.44 2.35c-.27.27-.5.5-1.03.5l.37-5.14 9.35-8.45c.41-.37-.09-.57-.63-.2L5.78 13.48.79 11.92c-1.08-.34-1.1-1.08.23-1.59L20.54 2.8c.9-.33 1.69.22 1.36 1.8Z"/>
      </svg>
      JOIN TELEGRAM
    </a>
 <div class="footer">
      © 2026 AURA CRICO
    </div>

  </section>
</main>

<script>
(function () {
  const button = document.getElementById('joinButton');
  let clicked = false;

  button.addEventListener('click', function(e) {

    if (clicked) {
      e.preventDefault();
      return;
    }

    clicked = true;

    // Manual Subscribe Event - Join Button Only
    if (typeof window.fbq === 'function') {
      window.fbq('track', 'Subscribe');
    }

    // Small tracking window before Telegram redirect
    e.preventDefault();

    const destination = button.href;

    setTimeout(function() {
      window.location.href = destination;
    }, 250);

  });
})();
</script>

</body>
